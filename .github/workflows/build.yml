# On every push: build for Apple Silicon, run the sound-engine tests, check the AU
# passes Logic's validator (auval), then package a .pkg installer you can download.
# When the version in CMakeLists.txt goes up, the build on main publishes a GitHub Release.

name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded libraries (JUCE, Catch2)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -G Xcode

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sound-engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check it is built for Apple Silicon
        run: |
          ARCHS=$(lipo -archs "build/ProTunezFXToys_artefacts/Release/AU/ProTunez FX Toys.component/Contents/MacOS/ProTunez FX Toys")
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* ]]

      - name: Logic's AU validator (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/ProTunezFXToys_artefacts/Release/AU/ProTunez FX Toys.component" ~/Library/Audio/Plug-Ins/Components/
          codesign --force --deep --sign - "$HOME/Library/Audio/Plug-Ins/Components/ProTunez FX Toys.component"
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aufx PzFx Rvmd | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log

      - name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION=$(sed -n 's/^project(ProTunezFXToys VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          # Publish only from main, and only if this version has no release yet.
          if [[ "$GITHUB_REF" == refs/heads/main ]] && ! gh release view "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "PUBLISH=1" >> "$GITHUB_ENV"; echo "VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          else
            echo "PUBLISH=0" >> "$GITHUB_ENV"; echo "VERSION=$APP_VERSION-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Package installer
        run: |
          chmod +x scripts/package.sh
          scripts/package.sh "$VERSION"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ProTunez-FX-Toys-${{ env.VERSION }}
          path: dist/*.pkg

      - name: Publish release (new versions only)
        if: env.PUBLISH == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: ProTunez FX Toys ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*.pkg
          body: |
            Apple Silicon Macs only. Download the .pkg below and double-click it
            (if macOS blocks it: right-click, then Open). In Logic: Audio FX → Audio Units →
            The Revivalists Media → ProTunez FX Toys.
